name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DOTENV_DISABLED: "1"

jobs:
  repository-hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked ignored files
        shell: bash
        run: |
          if [[ -n "$(git ls-files --cached --ignored --exclude-standard)" ]]; then
            echo "::error::The Git index contains ignored paths. Inspect them locally before committing."
            exit 1
          fi

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --locked
      - name: Run Python suite
        run: uv run --locked pytest -q

  frontend:
    name: React, OpenAPI, and browser contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application and frontend
        run: |
          uv sync --locked --no-dev
          npm ci --prefix frontend
      - name: Check generated API contract
        run: |
          uv run --locked --no-dev python scripts/export_openapi.py --check
          uv run --locked --no-dev python scripts/generate_typescript_api.py --check
      - name: Test, typecheck, and build frontend
        run: |
          npm test --prefix frontend
          npm run typecheck --prefix frontend
          npm run build --prefix frontend
          git diff --exit-code -- \
            frontend/openapi.json \
            frontend/src/api/types.generated.ts \
            tradingagents/web/static
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser workflow
        run: npm run test:e2e --prefix frontend

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --locked
      - name: Lint repository
        run: uv run --locked ruff check .

  wheel:
    name: wheel and fresh-install contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Build wheel
        # Build the wheel from an sdist so an incremental in-tree build/
        # directory cannot leak deleted package data into the wheel.
        run: uv build --out-dir wheelhouse
      - name: Inspect wheel contents and metadata
        run: python scripts/verify_wheel.py wheelhouse/trading_agents_x-*.whl
      - name: Fresh install and runtime smoke
        run: |
          python -m venv /tmp/tradingagents-fresh
          /tmp/tradingagents-fresh/bin/pip install wheelhouse/trading_agents_x-*.whl
          /tmp/tradingagents-fresh/bin/python -c \
            "import tradingagents, tradingagents.web; print(tradingagents.__version__)"
          /tmp/tradingagents-fresh/bin/tradingagents --help

  docker:
    name: Docker Web and worker smoke
    runs-on: ubuntu-latest
    env:
      TRADINGAGENTS_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@v4
      - name: Build and start local services
        run: docker compose up --build --detach web worker
      - name: Verify health and worker process
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/api/v1/health
          docker compose exec -T worker tradingagents --version
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down --volumes
